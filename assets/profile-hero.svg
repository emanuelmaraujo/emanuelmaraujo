<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="362" viewBox="0 0 1080 362" role="img" aria-labelledby="title desc">
<title id="title">Emanuel Araújo</title><desc id="desc">A midnight control panel with a mint and violet orbital network.</desc>
<style>
 @media (prefers-reduced-motion: no-preference) {
  .boot { animation: boot-in .66s cubic-bezier(.22,1,.36,1) backwards; }
  .boot-role { animation-delay: .2s; }
  .boot-credential { animation-delay: .36s; }
  .boot-core { animation: core-in .92s ease-out .12s backwards; }
  .checkmark { stroke-dasharray: 64; animation: draw-check .55s ease-out .48s backwards; }
  .mint-orbit { animation: orbit 6s linear infinite; }
  .violet-orbit { animation: orbit 9s linear infinite reverse; }
  .scan { animation: scan 7s ease-in-out infinite; }
  @keyframes boot-in {
   from { opacity: 0; transform: translateX(-26px); }
   to { opacity: 1; transform: translateX(0); }
  }
  @keyframes core-in {
   from { opacity: .15; transform: scale(.72); }
   to { opacity: 1; transform: scale(1); }
  }
  @keyframes draw-check { from { stroke-dashoffset: 64; } to { stroke-dashoffset: 0; } }
  @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes scan {
   0% { opacity: 0; transform: translateX(-160px); }
   12% { opacity: .75; }
   48% { opacity: .65; }
   62%, 100% { opacity: 0; transform: translateX(1100px); }
  }
 }
</style>
<defs>
 <linearGradient id="bg" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#060b1a"/><stop offset=".62" stop-color="#101c3a"/><stop offset="1" stop-color="#26164a"/></linearGradient>
 <linearGradient id="edge"><stop stop-color="#41f6cb"/><stop offset="1" stop-color="#9a76ff"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#6955fa" stop-opacity=".34"/><stop offset="1" stop-color="#6955fa" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="27" height="27" patternUnits="userSpaceOnUse"><path d="M27 0H0V27" fill="none" stroke="#9db0ea" stroke-opacity=".095"/></pattern>
 <clipPath id="panel"><rect x="2" y="2" width="1076" height="358" rx="23"/></clipPath>
 <linearGradient id="scan-glow"><stop stop-color="#46f8cc" stop-opacity="0"/><stop offset=".82" stop-color="#46f8cc" stop-opacity=".11"/><stop offset="1" stop-color="#46f8cc" stop-opacity="0"/></linearGradient>
</defs>
<rect x="1" y="1" width="1078" height="360" rx="24" fill="url(#bg)" stroke="#5667a2"/>
<rect x="2" y="2" width="1076" height="358" rx="23" fill="url(#grid)"/>
<g clip-path="url(#panel)"><g class="scan" opacity="0">
