 <ellipse rx="134" ry="42" transform="rotate(27)" fill="none" stroke="#9c81f9" stroke-opacity=".54"/>
 <g transform="rotate(-27) scale(1 .3134)"><g transform="rotate(-32)"><g class="mint-orbit">
