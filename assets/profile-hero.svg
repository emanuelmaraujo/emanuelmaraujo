<g font-family="DejaVu Sans Mono, monospace" font-size="14" letter-spacing="2">
 <text x="92" y="41" fill="#b8c8ee">SYSTEM INTERFACE / PROFILE</text>
 <text x="1034" y="41" fill="#b8c8ee" text-anchor="end">BRASÍLIA · BR</text>
 <text x="62" y="113" fill="#56f7d2">01 / APPLIED AI + SECURITY</text>
